              <div class="nav">
                <div class="nav-item active" id="nav-home" onclick="switchTab('home')"><span class="nav-icon">🏠</span>Home</div>
                <div class="nav-item" id="nav-themes" onclick="switchTab('themes')"><span class="nav-icon">🎨</span>Themes</div>
                <div class="nav-item" id="nav-target" onclick="switchTab('target')"><span class="nav-icon">🎯</span>Target</div>
                <div class="nav-item" id="nav-settings" onclick="switchTab('settings')"><span class="nav-icon">⚙️</span>Settings</div>
                <div class="nav-item" id="nav-logs" onclick="switchTab('logs')"><span class="nav-icon">🛠️</span>Logs</div>
              </div>

              <script>
              var J = {"Content-Type": "application/json"};
              var TABS = ['home','themes','target','settings','logs'];
              var THEMES = [["default","Default"],["neon","Neon"],["glass","Glass"],["minimal","Minimal"],["transparent","Transparent"]];
              var ACC = ["#8b5cf6","#38bdf8","#a3e635","#a855f7","#ef4444","#3b82f6","#10b981","#ec4899","#f97316","#64748b","#facc15"];
              var cfg = {theme:"default", accent:"#8b5cf6", showAmount:true, maxDonors:5, zoom:100, autoReset:true, resetHour:5};

              function $(id) { return document.getElementById(id); }
              function esc(s) {
                return String(s).replace(/[&<>"']/g, function(c) {
                  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
                });
              }
              function db() { return $('dbUrlInput').value.trim().replace(/\/$/, ""); }
              function dayKey(h) { return new Date(Date.now() + 19800000 - (Number(h) || 0) * 3600000).toISOString().slice(0, 10); }

              /* ---- logs ---- */
              function addNativeLog(msg) {
                var d = document.createElement('div');
                d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
                $('logBox').prepend(d);
                if (msg.indexOf('Firebase Sync HTTP 200') > -1) setTimeout(loadHistory, 4000);
              }
              function clearLogs() { $('logBox').innerHTML = ''; }

              /* ---- tabs ---- */
              function switchTab(t) {
                TABS.forEach(function(x) {
                  $('tab-' + x).classList.toggle('active', x === t);
                  $('nav-' + x).classList.toggle('active', x === t);
                });
                if (t === 'home') { loadHistory(); loadState(); }
                if (t === 'target') loadState();
                if (t === 'themes') loadConfig();
              }

              /* ---- permission / native settings ---- */
              function openPerm() { if (window.AndroidBridge) AndroidBridge.openNotificationSettings(); }
              function checkPerm() {
                if (window.AndroidBridge) $('permBtn').style.display = AndroidBridge.isPermissionGranted() ? 'none' : 'block';
              }
              function saveSettings(toast) {
                var listen = $('listenToggle').checked;
                if (window.AndroidBridge) AndroidBridge.setConfig(listen, db());
                addNativeLog("⚙️ Saved (Listening: " + listen + ")");
                if (toast) { loadConfig(); loadState(); loadHistory(); }
              }
              function copyOv() {
                var el = $('ovUrl');
                if (!el.value.trim()) { alert("Mudhalla Netlify overlay URL podu!"); return; }
                el.select();
                try { document.execCommand('copy'); addNativeLog("📋 Overlay URL copied"); } catch (e) { addNativeLog("Copy fail: long-press panni copy pannu"); }
              }

              /* ---- donations list (Home) ---- */
              async function loadHistory() {
                var box = $('donList');
                try {
                  var r = await fetch(db() + '/history.json?orderBy=%22%24key%22&limitToLast=60&t=' + Date.now());
                  var d = await r.json();
                  if (d && d.error) { box.innerHTML = '<div class="empty">' + esc(d.error) + '</div>'; return; }
                  var arr = Object.values(d || {}).filter(function(x) { return x && x.parsed && x.parsed.amount > 0; })
                    .sort(function(a, b) { return (b.ts || 0) - (a.ts || 0); });
                  $('cnt').textContent = arr.length;
                  if (!arr.length) { box.innerHTML = '<div class="empty">No donations yet 💸<br>OBS-la overlay open-ah irukkanum</div>'; return; }
                  box.innerHTML = arr.map(function(x) {
                    var n = x.parsed.name || 'Supporter';
                    var t = x.ts ? new Date(x.ts).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
                    return '<div class="don"><div class="dav">' + esc(n.charAt(0).toUpperCase()) + '</div>' +
                      '<div class="dinf"><b>' + esc(n) + '</b><span>' + esc(t) + '</span></div>' +
                      '<div class="damt">₹' + esc(x.parsed.amount) + '</div></div>';
                  }).join('');
                } catch (e) { box.innerHTML = '<div class="empty">Load error: ' + esc(e.message) + '</div>'; }
              }
              async function clearHistory() {
                if (!confirm('Donations list clear pannava? (Goal-um top supporters-um maaraadhu)')) return;
                try {
                  await fetch(db() + '/history.json', {method: 'DELETE'});
                  addNativeLog('🗑️ History cleared');
                  loadHistory();
                } catch (e) { addNativeLog('❌ Clear error: ' + e.message); }
              }

              /* ---- alerts ---- */
              function manualModal() { var b = $('manualBox'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; }
              async function sendRawAlert(rawText) {
                addNativeLog("🚀 Sending: " + rawText);
                try {
                  var res = await fetch(db() + "/latestAlert.json", {method: "PUT", headers: J, body: JSON.stringify({rawText: rawText, id: Date.now().toString()})});
                  addNativeLog(res.ok ? "✅ Firebase Accepted Alert (HTTP " + res.status + ")" : "❌ Firebase Error: HTTP " + res.status);
                } catch (e) { addNativeLog("❌ Network Error: " + e.message); }
              }
              function sendTestAlert() { sendRawAlert("TEST USER has sent ₹10 to your bank account"); }
              function fireManual() {
                var n = $('simName').value.trim() || "Supporter";
                var a = $('simAmount').value.trim() || "10";
                sendRawAlert(n + " has sent ₹" + a + " to your bank account");
                $('manualBox').style.display = 'none';
              }

              /* ---- goal / state ---- */
              async function loadState() {
                try {
                  var res = await fetch(db() + "/state.json?t=" + Date.now());
                  var d = await res.json();
                  if (!d) return;
                  $('todayTot').textContent = "₹" + (d.current || 0);
                  $('curTotal').value = d.current || 0;
                  $('targetGoal').value = d.target || 1000;
                  $('goalTitle').value = d.title || "";
                } catch (e) { addNativeLog("⚠️ State load error: " + e.message); }
              }
              async function updateGoal() {
                var o = {}, t = $('goalTitle').value.trim();
                var c = Number($('curTotal').value), g = Number($('targetGoal').value);
                if (t) o.title = t;
                if (!isNaN(c)) o.current = c;
                if (g > 0) o.target = g;
                try {
                  await fetch(db() + "/state.json", {method: "PATCH", headers: J, body: JSON.stringify(o)});
                  addNativeLog("✅ Goal Updated: ₹" + c + " / ₹" + g);
                  loadState();
                } catch (e) { addNativeLog("❌ Update error: " + e.message); }
              }
              async function resetAll() {
                if (!confirm("Goal ₹0 + supporters clear pannava?")) return;
                var g = Number($('targetGoal').value) || 1000;
                try {
                  await fetch(db() + "/state.json", {method: "PATCH", headers: J,
                    body: JSON.stringify({current: 0, target: g, supporters: null, lastReset: dayKey(cfg.resetHour)})});
                  addNativeLog("🧹 Reset Today's Data to ₹0!");
                  loadState();
                } catch (e) { addNativeLog("❌ Reset error: " + e.message); }
              }

              /* ---- themes / config ---- */
              function renderThemeUI() {
                $('themeGrid').innerHTML = THEMES.map(function(t) {
                  return '<div class="tcard' + (cfg.theme === t[0] ? ' sel' : '') + '" onclick="pickTheme(\'' + t[0] + '\')">' + t[1] + '</div>';
                }).join('');
                $('swatches').innerHTML = ACC.map(function(c) {
                  return '<div class="sw' + (cfg.accent === c ? ' sel' : '') + '" style="background:' + c + '" onclick="pickAccent(\'' + c + '\')"></div>';
                }).join('');
                $('showAmt').checked = !!cfg.showAmount;
                $('maxDon').value = cfg.maxDonors;
                $('zoom').value = cfg.zoom;
                $('zoomVal').textContent = cfg.zoom;
                $('autoReset').checked = !!cfg.autoReset;
                $('resetHour').value = String(cfg.resetHour);
              }
              function pickTheme(t) { cfg.theme = t; renderThemeUI(); }
              function pickAccent(c) { cfg.accent = c; renderThemeUI(); }
              async function loadConfig() {
                try {
                  var r = await fetch(db() + "/state/config.json?t=" + Date.now());
                  var d = await r.json();
                  if (d && typeof d === "object") Object.keys(d).forEach(function(k) { cfg[k] = d[k]; });
                } catch (e) { addNativeLog("⚠️ Config load error: " + e.message); }
                renderThemeUI();
              }
              async function applyConfig() {
                cfg.showAmount = $('showAmt').checked;
                cfg.maxDonors = Math.max(1, Math.min(20, Number($('maxDon').value) || 5));
                cfg.zoom = Number($('zoom').value) || 100;
                cfg.autoReset = $('autoReset').checked;
                cfg.resetHour = Number($('resetHour').value) || 0;
                try {
                  var r = await fetch(db() + "/state/config.json", {method: "PATCH", headers: J, body: JSON.stringify(cfg)});
                  await fetch(db() + "/state.json", {method: "PATCH", headers: J, body: JSON.stringify({lastReset: dayKey(cfg.resetHour)})});
                  addNativeLog(r.ok ? "✅ Theme & settings applied" : "❌ Config error: HTTP " + r.status + " (Firebase rules check pannu)");
                } catch (e) { addNativeLog("❌ Config error: " + e.message); }
              }

              /* ---- init ---- */
              window.onload = function() {
                var sel = $('resetHour');
                for (var h = 0; h < 24; h++) {
                  var o = document.createElement('option');
                  o.value = String(h);
                  o.textContent = ((h % 12) || 12) + ':00 ' + (h < 12 ? 'AM' : 'PM');
                  sel.appendChild(o);
                }
                $('ovUrl').value = localStorage.getItem('ovUrl') || '';
                if (window.AndroidBridge) {
                  $('dbUrlInput').value = AndroidBridge.getDbUrl();
                  $('listenToggle').checked = AndroidBridge.getListening();
                  checkPerm();
                  setInterval(checkPerm, 3000);
                }
                renderThemeUI();
                loadConfig();
                loadState();
                loadHistory();
                setInterval(function() { if ($('tab-home').classList.contains('active')) loadHistory(); }, 15000);
              };
              </script>
              </body>
              </html>
          """)
          PYEOF

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackTamilanAlerts-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
