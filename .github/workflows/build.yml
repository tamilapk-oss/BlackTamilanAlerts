                    <input type="range" id="zoom" min="50" max="300" step="10" value="100" style="width:100%;margin-bottom:12px;" oninput="$('zoomVal').textContent=this.value">
                    <button class="btn-main" onclick="applyConfig()">Apply Changes</button>
                    <div class="hint" style="margin-top:8px;">Overlay 8 sec-kulla automatic-ah maarum.</div>
                  </div>
                </div>

                <!-- TARGET -->
                <div id="tab-target" class="tab">
                  <div class="card">
                    <div style="font-weight:800; font-size:16px; margin-bottom:10px;">🎯 Today Target</div>
                    <span class="label">Challenge Text</span>
                    <input type="text" id="goalTitle" placeholder="Today Goal">
                    <div class="row">
                      <div style="flex:1"><span class="label">Current ₹</span><input type="number" id="curTotal" value="0"></div>
                      <div style="flex:1"><span class="label">Target ₹</span><input type="number" id="targetGoal" value="1000"></div>
                    </div>
                    <button class="btn-main" onclick="updateGoal()">Apply Goal Changes</button>
                    <button class="btn-main btn-red" onclick="resetAll()">Reset Today's Data (₹0)</button>
                  </div>
