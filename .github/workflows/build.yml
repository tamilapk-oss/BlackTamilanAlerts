name: Build Black Tamilan Alerts APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Project Files
        run: |
          python3 - << 'PYEOF'
          import os, pathlib, textwrap

          def write(path, content):
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              clean_text = textwrap.dedent(content).strip() + "\n"
              p.write_text(clean_text, encoding="utf-8")

          write("settings.gradle", """
              rootProject.name = "BlackTamilanAlerts"
              include ':app'
          """)

          write("build.gradle", """
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
                  dependencies {
                      classpath 'com.android.tools.build:gradle:8.2.2'
                  }
              }
              allprojects {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
          """)

          write("gradle.properties", """
              android.useAndroidX=true
              org.gradle.jvmargs=-Xmx2048m
          """)

          write("app/build.gradle", """
              plugins {
                  id 'com.android.application'
              }
              android {
                  namespace 'com.blacktamilan.alerts'
                  compileSdk 34
                  defaultConfig {
                      applicationId "com.blacktamilan.alerts"
                      minSdk 24
                      targetSdk 34
                      versionCode 1
                      versionName "1.0"
                  }
                  compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }
              }
              dependencies {}
          """)

          write("app/src/main/AndroidManifest.xml", """
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                  <uses-permission android:name="android.permission.INTERNET" />
                  <application
                      android:label="Black Tamilan Alerts"
                      android:usesCleartextTraffic="true"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                      <activity android:name=".MainActivity" android:exported="true">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                      </activity>
                      <service android:name=".NotificationListener"
                          android:label="Black Tamilan Listener"
                          android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                          android:exported="true">
                          <intent-filter>
                              <action android:name="android.service.notification.NotificationListenerService" />
                          </intent-filter>
                      </service>
                  </application>
              </manifest>
          """)

          write("app/src/main/java/com/blacktamilan/alerts/NotificationListener.java", r"""
              package com.blacktamilan.alerts;
              import android.service.notification.NotificationListenerService;
              import android.service.notification.StatusBarNotification;
              import android.os.Bundle;
              import android.os.Parcelable;
              import android.app.Notification;
              import android.content.SharedPreferences;
              import android.content.Intent;
              import java.io.OutputStream;
              import java.net.HttpURLConnection;
              import java.net.URL;

              public class NotificationListener extends NotificationListenerService {
                  @Override
                  public void onNotificationPosted(StatusBarNotification sbn) {
                      SharedPreferences prefs = getSharedPreferences("BTPrefs", MODE_PRIVATE);
                      if (!prefs.getBoolean("listening", true)) return;

                      String pkg = sbn.getPackageName();
                      if (pkg == null) return;
                      String p = pkg.toLowerCase();
                      if (!p.contains("phonepe") && !p.contains("tez") && !p.contains("gpay") && !p.contains("paytm") && !p.contains("bharatpe")) {
                          return;
                      }

                      Bundle extras = sbn.getNotification().extras;
                      CharSequence titleCs = extras.getCharSequence(Notification.EXTRA_TITLE);
                      String title = titleCs != null ? titleCs.toString() : "";
                      CharSequence textCs = extras.getCharSequence(Notification.EXTRA_TEXT);
                      if (textCs == null || textCs.length() == 0) textCs = extras.getCharSequence(Notification.EXTRA_BIG_TEXT);
                      String text = textCs != null ? textCs.toString() : "";
                      if (text.isEmpty()) {
                          Parcelable[] msgs = extras.getParcelableArray("android.messages");
                          if (msgs != null && msgs.length > 0 && msgs[msgs.length - 1] instanceof Bundle) {
                              CharSequence mt = ((Bundle) msgs[msgs.length - 1]).getCharSequence("text");
                              if (mt != null) text = mt.toString();
                          }
                      }
                      String raw = (title + " " + text).trim();
                      if (raw.isEmpty()) return;

                      String low = raw.toLowerCase();
                      boolean hasAmt = raw.contains("₹") || low.contains("rs.") || low.contains("rs ") || low.contains("inr");
                      boolean credit = low.contains("has sent") || low.contains("received") || (low.contains(" sent ") && low.contains("to you"));
                      if (!(hasAmt && credit)) {
                          sendLog("⏭️ Skipped (not a payment): " + raw);
                          return;
                      }

                      sendLog("📲 Caught (" + pkg + "): " + raw);
                      pushToFirebase(raw);
                  }

                  private void pushToFirebase(String rawText) {
                      SharedPreferences prefs = getSharedPreferences("BTPrefs", MODE_PRIVATE);
                      String dbUrl = prefs.getString("dbUrl", "https://mystreamalerts-c0742-default-rtdb.firebaseio.com");
                      if (dbUrl.endsWith("/")) dbUrl = dbUrl.substring(0, dbUrl.length() - 1);
                      final String targetUrl = dbUrl + "/latestAlert.json";

                      new Thread(() -> {
                          try {
                              URL url = new URL(targetUrl);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestMethod("PUT");
                              conn.setRequestProperty("Content-Type", "application/json");
                              conn.setConnectTimeout(10000);
                              conn.setReadTimeout(10000);
                              conn.setDoOutput(true);
                              String safe = rawText.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", " ").replace("\r", " ");
                              String json = "{\"rawText\":\"" + safe + "\",\"id\":\"" + System.currentTimeMillis() + "\"}";
                              try (OutputStream os = conn.getOutputStream()) {
                                  os.write(json.getBytes("UTF-8"));
                              }
                              int code = conn.getResponseCode();
                              conn.disconnect();
                              sendLog("✅ Firebase Sync HTTP " + code);
                          } catch (Exception e) {
                              sendLog("❌ Firebase Error: " + e.getMessage());
                          }
                      }).start();
                  }

                  private void sendLog(String msg) {
                      Intent i = new Intent("BT_LOG_EVENT");
                      i.setPackage(getPackageName());
                      i.putExtra("msg", msg);
                      sendBroadcast(i);
                  }
              }
          """)

          write("app/src/main/java/com/blacktamilan/alerts/MainActivity.java", r"""
              package com.blacktamilan.alerts;
              import android.app.Activity;
              import android.os.Bundle;
              import android.webkit.WebView;
              import android.webkit.WebSettings;
              import android.webkit.JavascriptInterface;
              import android.content.Intent;
              import android.content.IntentFilter;
              import android.content.BroadcastReceiver;
              import android.content.Context;
              import android.provider.Settings;
              import android.os.Build;

              public class MainActivity extends Activity {
                  private WebView webView;
                  private BroadcastReceiver logReceiver;

                  @Override
                  protected void onCreate(Bundle savedInstanceState) {
                      super.onCreate(savedInstanceState);
                      webView = new WebView(this);
                      WebSettings ws = webView.getSettings();
                      ws.setJavaScriptEnabled(true);
                      ws.setDomStorageEnabled(true);
                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");
                      webView.loadUrl("file:///android_asset/index.html");
                      setContentView(webView);

                      logReceiver = new BroadcastReceiver() {
                          @Override
                          public void onReceive(Context context, Intent intent) {
                              String msg = intent.getStringExtra("msg");
                              if (msg != null) {
                                  String safe = msg.replace("\\", "\\\\").replace("'", "\\'").replace("\n", " ").replace("\r", " ");
                                  runOnUiThread(() -> webView.evaluateJavascript("if(window.addNativeLog) addNativeLog('" + safe + "');", null));
                              }
                          }
                      };
                      IntentFilter filter = new IntentFilter("BT_LOG_EVENT");
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(logReceiver, filter, Context.RECEIVER_NOT_EXPORTED);
                      } else {
                          registerReceiver(logReceiver, filter);
                      }
                  }

                  @Override
                  protected void onDestroy() {
                      super.onDestroy();
                      if (logReceiver != null) unregisterReceiver(logReceiver);
                  }

                  public class WebAppInterface {
                      @JavascriptInterface
                      public void openNotificationSettings() {
                          startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS));
                      }

                      @JavascriptInterface
                      public boolean isPermissionGranted() {
                          String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                          return flat != null && flat.contains(getPackageName());
                      }

                      @JavascriptInterface
                      public void setConfig(boolean listening, String dbUrl) {
                          getSharedPreferences("BTPrefs", MODE_PRIVATE).edit()
                              .putBoolean("listening", listening)
                              .putString("dbUrl", dbUrl)
                              .apply();
                      }

                      @JavascriptInterface
                      public String getDbUrl() {
                          return getSharedPreferences("BTPrefs", MODE_PRIVATE)
                              .getString("dbUrl", "https://mystreamalerts-c0742-default-rtdb.firebaseio.com");
                      }

                      @JavascriptInterface
                      public boolean getListening() {
                          return getSharedPreferences("BTPrefs", MODE_PRIVATE).getBoolean("listening", true);
                      }
                  }
              }
          """)

          write("app/src/main/assets/index.html", r"""
              <!DOCTYPE html>
              <html>
              <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <style>
              * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
              body { margin: 0; background: #f4f6f9; color: #1e293b; padding-bottom: 84px; }
              .header { background: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 10; }
              .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; }
              .title { font-weight: 800; font-size: 17px; color: #0f172a; }
              .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; background: #dcfce7; color: #16a34a; display: inline-block; }
              .container { padding: 14px; }
              .card { background: #fff; border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; }
              .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
              .switch { position: relative; display: inline-block; width: 50px; height: 28px; flex: none; }
              .switch input { opacity: 0; width: 0; height: 0; }
              .slider { position: absolute; cursor: pointer; inset: 0; background: #cbd5e1; transition: .3s; border-radius: 34px; }
              .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background: #fff; transition: .3s; border-radius: 50%; }
              input:checked + .slider { background: #84cc16; }
              input:checked + .slider:before { transform: translateX(22px); }
              .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
              .q-btn { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 10px 4px; text-align: center; cursor: pointer; }
              .q-icon { font-size: 20px; display: block; margin-bottom: 4px; }
              .q-label { font-size: 11px; font-weight: 700; color: #475569; }
              .label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin: 4px 0 6px; display: block; }
              input[type="text"], input[type="number"], select { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 15px; font-weight: 600; background: #f8fafc; margin-bottom: 10px; }
              .btn-main { width: 100%; padding: 13px; border: none; border-radius: 14px; background: #0f172a; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 4px; }
              .btn-red { background: #ef4444; }
              .btn-perm { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; width: 100%; margin-bottom: 12px; cursor: pointer; }
              .stats { display: flex; gap: 10px; margin-bottom: 12px; }
              .stat { flex: 1; background: #1e293b; color: #fff; border-radius: 14px; padding: 12px 14px; }
              .stat small { font-size: 10px; font-weight: 700; color: #94a3b8; }
              .stat div { font-size: 22px; font-weight: 800; color: #a3e635; margin-top: 2px; }
              .sec-title { font-weight: 800; font-size: 15px; margin: 4px 2px 8px; display: flex; justify-content: space-between; align-items: center; }
              .don { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #f1f5f9; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
              .dav { width: 36px; height: 36px; border-radius: 50%; background: #ecfccb; color: #4d7c0f; display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
              .dinf { flex: 1; min-width: 0; }
              .dinf b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .dinf span { font-size: 11px; color: #64748b; }
              .damt { font-weight: 800; color: #16a34a; font-size: 16px; }
              .empty { text-align: center; color: #94a3b8; font-size: 13px; padding: 24px 0; }
              .tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
              .tcard { border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px 8px; text-align: center; font-weight: 800; font-size: 14px; cursor: pointer; background: #fff; }
              .tcard.sel { border-color: #84cc16; background: #f7fee7; }
              .swrow { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
              .sw { width: 38px; height: 38px; border-radius: 10px; cursor: pointer; border: 3px solid transparent; }
              .sw.sel { border-color: #0f172a; }
              .log-box { background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 12px; padding: 12px; border-radius: 12px; min-height: 340px; max-height: 60vh; overflow-y: auto; line-height: 1.5; }
              .log-box div { margin-bottom: 4px; word-break: break-word; }
              .hint { font-size: 12px; color: #64748b; margin: -4px 0 10px; }
              .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 6px 0; z-index: 20; }
              .nav-item { text-align: center; color: #64748b; font-size: 10px; font-weight: 700; cursor: pointer; padding: 5px 9px; border-radius: 18px; }
              .nav-item.active { background: #ecfccb; color: #4d7c0f; }
              .nav-icon { font-size: 18px; display: block; margin-bottom: 1px; }
              .tab { display: none; }
              .tab.active { display: block; }
              </style>
              </head>
              <body>
              <div class="header">
                <div class="avatar">BT</div>
                <div>
                  <div class="title">Black Tamilan</div>
                  <span class="badge">● ACTIVE LIFETIME</span>
                </div>
              </div>

              <div class="container">
                <button class="btn-perm" id="permBtn" onclick="openPerm()" style="display:none;">⚠️ Tap here to Enable Notification Permission!</button>

                <!-- HOME -->
                <div id="tab-home" class="tab active">
                  <div class="card row">
                    <div>
                      <div style="font-weight:800; font-size:16px;">Listening Mode</div>
                      <div style="font-size:12px; color:#64748b;">Auto-read incoming UPI donations</div>
                    </div>
                    <label class="switch"><input type="checkbox" id="listenToggle" checked onchange="saveSettings()"><span class="slider"></span></label>
                  </div>
                  <div class="quick-grid">
                    <div class="q-btn" onclick="manualModal()"><span class="q-icon">🔔</span><span class="q-label">Add Alert</span></div>
                    <div class="q-btn" onclick="sendTestAlert()"><span class="q-icon">⚡</span><span class="q-label">Test Alert</span></div>
                    <div class="q-btn" onclick="loadHistory();loadState()"><span class="q-icon">🔄</span><span class="q-label">Refresh</span></div>
                    <div class="q-btn" onclick="clearHistory()"><span class="q-icon">🗑️</span><span class="q-label">Clear</span></div>
                  </div>
                  <div class="card" id="manualBox" style="display:none;">
                    <span class="label">Manual Alert</span>
                    <input type="text" id="simName" placeholder="Supporter Name">
                    <input type="number" id="simAmount" placeholder="Amount ₹">
                    <button class="btn-main" onclick="fireManual()">Send Alert Now 🚀</button>
                  </div>
                  <div class="stats">
                    <div class="stat"><small>TODAY TOTAL</small><div id="todayTot">₹0</div></div>
                    <div class="stat"><small>DONATIONS</small><div id="cnt">0</div></div>
                  </div>
                  <div class="sec-title"><span>Donations List</span><span style="font-size:11px;color:#64748b;font-weight:600;">latest first</span></div>
                  <div id="donList"><div class="empty">Loading...</div></div>
                </div>

                <!-- THEMES -->
                <div id="tab-themes" class="tab">
                  <div class="card">
                    <div style="font-weight:800; font-size:16px; margin-bottom:10px;">🎨 Overlay Theme</div>
                    <div class="tgrid" id="themeGrid"></div>
                    <span class="label">Theme Accent</span>
                    <div class="swrow" id="swatches"></div>
                    <div class="row"><span style="font-weight:700;">Show Amount</span>
                      <label class="switch"><input type="checkbox" id="showAmt" checked><span class="slider"></span></label></div>
                    <span class="label" style="margin-top:12px;">Max Top Supporters (1 - 20)</span>
                    <input type="number" id="maxDon" min="1" max="20" value="5">
